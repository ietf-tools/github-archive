[project]
name = "github-archive"
version = "0.1.0"
description = "Back up IETF working group GitHub repositories"
requires-python = ">=3.14"
dependencies = [
    "archive-repo",
]

[project.scripts]
github-archive = "github_archive.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.uv.sources]
archive-repo = { git = "https://github.com/ietf-tools/archive-repo", rev = "bc4feed72cdf775152d10f88714f7474d72883d6" }
